# Before DNS/TLS: expose only safe health, never credentials or pairing over HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 8k;
    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location / { return 426; }
}
