# Install after certbot certonly --nginx has issued this hostname's certificate.
limit_req_zone $binary_remote_addr zone=gateway_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=gateway_connections:1m;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wa-gateway.mykustomers.com;
    server_tokens off;
    access_log off;
    return 308 https://wa-gateway.mykustomers.com$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name wa-gateway.mykustomers.com;
    ssl_certificate /etc/letsencrypt/live/wa-gateway.mykustomers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa-gateway.mykustomers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gateway_tls:1m;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/wa-gateway-error.log crit;
    client_max_body_size 8k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_req zone=gateway_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn gateway_connections 10;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host wa-gateway.mykustomers.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
